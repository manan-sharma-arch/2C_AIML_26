<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function Pattern(){
            let n=5;
            for(let i=1;i<n;i++)
            {
                for(let j=1;j<=i;j++)
                {
                    document.write("*");
                }
            document.write("<br>");
            }

        }
    </script>
</head>
<body>
    <h4>my pattern!</h4>
    <input type="button" onclick="Pattern()" value="result">
</body>
</html>
