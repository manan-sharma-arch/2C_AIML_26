<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function F(fn) {
            return fn;
        }
        function L(ln) {
            return ln;
        }
        function Name() {
            let firstname = F("vikas");
            let lastname = L("choudhary");
            document.write(firstname + " " + lastname);
        }
    </script>
</head>
<body>
    <input type="button" onclick="Name()" value="display">
    

</body>
</html>
